<!DOCTYPE HTML>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Registrarse - Cinema</title>


    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="assets/css/bootstrap.min.css">

    <!-- Iconos -->
    <link rel="stylesheet"
          href="assets/css/icofont.css">

    <!-- CSS principal -->
    <link rel="stylesheet"
          href="assets/css/style.css">

    <!-- CSS responsive -->
    <link rel="stylesheet"
          href="assets/css/responsive.css">


    <style>

        /* =========================================
           FONDO
        ========================================= */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

        }


        body {

            min-height: 100vh;

            background-image:
                url("assets/img/video1.png");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* =========================================
           CONTENEDOR DEL REGISTRO
        ========================================= */

        .registro-container {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;

            box-sizing: border-box;

        }


        /* =========================================
           CAJA
        ========================================= */

        .registro-box {

    width: 100%;

    max-width: 450px;

    background: rgba(20, 20, 20, 0.80);

    padding: 35px;

    border-radius: 10px;

    box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.6);

    box-sizing: border-box;

}


        /* =========================================
           LOGO
        ========================================= */

        .registro-logo {

            text-align: center;

            margin-bottom: 20px;

        }


        .registro-logo img {

            width: 150px;

            max-width: 70%;

        }


        /* =========================================
           TITULO
        ========================================= */

        .registro-box h1 {

            color: white;

            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;

        }


        .registro-subtitulo {

            color: #aaa;

            text-align: center;

            margin-bottom: 30px;

        }


        /* =========================================
           CAMPOS
        ========================================= */

        .registro-campo {

            margin-bottom: 20px;

        }


        .registro-campo label {

            display: block;

            color: white;

            font-size: 14px;

            margin-bottom: 8px;

        }


        .registro-campo input {

            width: 100%;

            height: 45px;

            padding: 10px 15px;

            border: none;

            border-radius: 4px;

            background: #ffffff;

            color: #333;

            box-sizing: border-box;

        }


        .registro-campo input:focus {

            outline: 2px solid #f39c12;

        }


        /* =========================================
           BOTÓN
        ========================================= */

        .btn-registro {

            width: 100%;

            border: none;

            padding: 12px;

            background: #f39c12;

            color: white;

            border-radius: 4px;

            cursor: pointer;

            font-size: 15px;

        }


        .btn-registro:hover {

            background: #e67e22;

        }


        /* =========================================
           LOGIN
        ========================================= */

        .registro-login {

            text-align: center;

            margin-top: 25px;

            color: #aaa;

        }


        .registro-login a {

            color: #f39c12;

            text-decoration: none;

        }


        .registro-login a:hover {

            color: #ffffff;

        }


        /* =========================================
           CELULARES
        ========================================= */

        @media (max-width: 480px) {

            .registro-box {

                padding: 25px 20px;

            }


            .registro-box h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         FORMULARIO DE REGISTRO
    ========================================= -->

    <div class="registro-container">

        <div class="registro-box">


            <!-- LOGO -->

            <div class="registro-logo">

                <img
                    src="assets/img/k1.png"
                    alt="Cinema">

            </div>


            <!-- TITULO -->

            <h1>
                Crear cuenta
            </h1>


            <p class="registro-subtitulo">
                Regístrate para comprar tus boletos
            </p>


            <!-- FORMULARIO -->

            <form onsubmit="registrar(event)">


                <!-- NOMBRE -->

                <div class="registro-campo">

                    <label>
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre"
                        required>

                </div>


                <!-- CORREO -->

                <div class="registro-campo">

                    <label>
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="Ingresa tu correo"
                        required>

                </div>


                <!-- CONTRASEÑA -->

                <div class="registro-campo">

                    <label>
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Crea una contraseña"
                        required>

                </div>


                <!-- CONFIRMAR -->

                <div class="registro-campo">

                    <label>
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        placeholder="Repite tu contraseña"
                        required>

                </div>


                <!-- BOTON -->

                <button
                    type="submit"
                    class="btn-registro">

                    <i class="icofont icofont-user"></i>

                    Crear cuenta

                </button>


            </form>


            <!-- LOGIN -->

            <div class="registro-login">

                ¿Ya tienes una cuenta?

                <a href="index.html">

                    Iniciar sesión

                </a>

            </div>


        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        function registrar(event) {

            event.preventDefault();


            let password =
                document.getElementById(
                    "password"
                ).value;


            let confirmar =
                document.getElementById(
                    "confirmar"
                ).value;


            if (password !== confirmar) {

                alert(
                    "Las contraseñas no coinciden."
                );

                return;

            }


            alert(
                "Cuenta creada correctamente."
            );


            window.location.href =
                "index.html";

        }

    </script>


</body>

</html>
